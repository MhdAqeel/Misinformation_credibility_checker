services:
  credibility-checker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credibility-checker-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - DB_PATH=/app/backend/data/credibility.db
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    volumes:
      # Persistent volume for SQLite database storage
      - credibility-data:/app/backend/data

volumes:
  credibility-data:
    name: credibility_sqlite_data
